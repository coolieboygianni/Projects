<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="stylesheet.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom New Tab</title>
    <style>
        body {
            font-family: 'Emotion Engine', sans-serif;
            background-color: #32302F; /* Dark background color */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            color: #D4BE98; /* Light color for text */
            text-align: center;
        }
        h1 {
            font-size: 2em;
            color: #D4BE98;
            margin-bottom: 20px;
        }
        .logo-container {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }
        .logo {
            display: block;
            width: 100px;
            height: 100px;
            transition: transform 0.3s ease;
            border-radius: 8px;
            padding: 10px;
        }
        .logo:hover {
            transform: scale(1.1);
        }
        a {
            text-decoration: none;
        }
        p {
        color: #D4BE98; /* Light color for text */
        font-size: 1.2em; /* Adjust font size */
        margin-top: 5px; /* Space between the logo and text */
    }
    </style>
</head>
<body>
    <h1>System</h1>
    <div class="logo-container">
        <a href="https://www.youtube.com">
            <img src="https://i.pinimg.com/736x/8b/4c/e7/8b4ce7fce7e9cf380a6c8fd01b57042d.jpg" alt="YouTube" class="logo">
            <p>YouTube</p> 
        </a>
        <a href="https://chat.openai.com">
            <img src="https://images.seeklogo.com/logo-png/46/2/chatgpt-logo-png_seeklogo-465219.png" alt="ChatGPT" class="logo">
            <p>ChatGPT</p>
        </a>
        <a href="https://www.gradescope.com/">
            <img src="https://play-lh.googleusercontent.com/IeBGwe-o9nvh3QSu8GqEz_OTAG8w-Q6hS5IFDZrgl9KXK4KwOQaLbjdGHCSh8sE-_RQ" alt="Gradescope" class="logo">
            <p>Gradescope</p>
        </a>
        <a href="https://www.cs.hunter.cuny.edu/~saad/courses/dm/">
            <img src="https://media1.tenor.com/m/bp_fG9jxkBEAAAAC/tyler-the-creator-necklace.gif" alt="CSCI150" class="logo">
            <p>CSCI 150</p>
        </a>
        <a href="https://mail.google.com/mail/u/1/#inbox">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Gmail_icon_%282020%29.svg/2560px-Gmail_icon_%282020%29.svg.png" alt="Gmail" class="logo">
            <p>Gmail</p> 
        </a>
    </div>
    <div class="logo-container">
        <a href="https://pomofocus.io/">
            <img src="https://lh3.googleusercontent.com/frn4WyFNdrJtHzDgKkfKNLxxBRz-TfCUplE9R4wn8vT98frHPXJcyWA6AV3zMBV8M2JlslnofdO5jOQN1Qb_uGa8jw=s1280-w1280-h800" alt="Pomfocus" class="logo">
            <p>Pomodoro focus</p>
        </a>
        <a href="https://tong-yee.github.io/135/2025_spring.html">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/ISO_C%2B%2B_Logo.svg" alt="CSCI135" class="logo">
            <p>CSCI 135</p>
        </a>
        <a href="https://brightspace.cuny.edu/d2l/home/7008">
            <img src="https://www.cuny.edu/wp-content/uploads/sites/4/page-assets/home-preview/branding-guidelines/logo/Correct_Usage_Logo3.png" alt="Brightspace" class="logo">
            <p>Brightspace</p>
        </a>
        <a href="https://home.cunyfirst.cuny.edu/psc/cnyihprd/EMPLOYEE/EMPL/c/NUI_FRAMEWORK.PT_LANDINGPAGE.GBL">
            <img src="https://www.cuny.edu/wp-content/uploads/sites/4/page-assets/home-preview/branding-guidelines/logo/Correct_Usage_Logo3.png" alt="CunyHomepage" class="logo">
            <p>Student Center</p>
        </a>
        <a href="https://leetcode.com/">
            <img src="https://media.tenor.com/Z9uG-sgzgo4AAAAM/ishowspeed-jump.gif" alt="Leetcode" class="logo">
            <p>Leetcode</p>
        </a>
    </div>
</body>
</html>
